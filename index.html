<!doctype html>
<html lang="en">
<head>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 700px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      color: #c9d1e8;
    }
    .links {
      margin-top: 28px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    a {
      color: white;
      text-decoration: none;
      border: 1px solid #3a4668;
      padding: 12px 18px;
      border-radius: 10px;
    }
    a:hover {
      background: #141b31;
    }

  <div class="box">
    <h1>Lucen</h1>
    <p>Your personal astrology, dream and insight companion.</p>
    <div class="links">
      <a href="https://legal.lucennapp.com/privacy.html">Privacy Policy</a>
